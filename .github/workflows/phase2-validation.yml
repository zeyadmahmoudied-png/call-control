name: CallControl Phase 2 Validation

on:
  push:
    paths:
      - "CallControl-phase2.zip"
      - ".github/workflows/phase2-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-and-android-build:
    name: JVM tests and Android compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Phase 2 archive
        run: |
          test -f CallControl-phase2.zip || {
            echo "::error::CallControl-phase2.zip is missing from the repository root."
            exit 1
          }
          unzip -t CallControl-phase2.zip
          mkdir phase2-source
          unzip -q CallControl-phase2.zip -d phase2-source
          test -f phase2-source/CallControl/gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: phase2-source/CallControl/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run JVM unit tests
        working-directory: phase2-source/CallControl
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :domain:test :storage-core:test

      - name: Build Android storage module
        working-directory: phase2-source/CallControl
        run: ./gradlew --no-daemon :storage-android:assembleDebug

      - name: Upload generated Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-room-schemas
          path: phase2-source/CallControl/storage-android/schemas/
          if-no-files-found: warn

      - name: Upload Android build outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-android-build
          path: phase2-source/CallControl/storage-android/build/outputs/

  android-instrumentation:
    name: Android instrumentation tests
    runs-on: ubuntu-latest
    needs: jvm-and-android-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and extract Phase 2 archive
        run: |
          test -f CallControl-phase2.zip
          mkdir phase2-source
          unzip -q CallControl-phase2.zip -d phase2-source
          test -f phase2-source/CallControl/gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run Android instrumentation tests on API 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: phase2-source/CallControl
          script: |
            chmod +x ./gradlew
            ./gradlew --no-daemon :storage-android:connectedDebugAndroidTest
