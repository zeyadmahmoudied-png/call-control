name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, e.g. 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4

      - name: JVM tests must pass before releasing
        run: ./gradlew --no-daemon :domain:test :storage-core:test

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p "$RUNNER_TEMP/ks"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ks/release.jks"
            PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"; KIND="persistent (from repository secrets)"
          else
            # No secret configured: generate a throw-away key. The APK is signed and installable, but a LATER
            # release signed with a different key cannot update it in place (uninstall first).
            PASS="$(openssl rand -hex 16)"; ALIAS="callcontrol"; KIND="EPHEMERAL (no KEYSTORE_BASE64 secret set)"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/ks/release.jks" -storetype PKCS12 \
              -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 9125 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Call Control, O=Call Control, C=EG"
          fi
          echo "::add-mask::$PASS"
          {
            echo "CC_KEYSTORE_PATH=$RUNNER_TEMP/ks/release.jks"
            echo "CC_KEYSTORE_PASSWORD=$PASS"
            echo "CC_KEY_ALIAS=$ALIAS"
            echo "CC_KEY_PASSWORD=$PASS"
            echo "CC_VERSION_NAME=${{ inputs.version }}"
            echo "CC_VERSION_CODE=${{ github.run_number }}"
            echo "KEY_KIND=$KIND"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify signature, hash, package
        run: |
          APK_SRC=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          test -f "$APK_SRC"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -n1)
          NAME="CallControl-${{ inputs.version }}.apk"
          cp "$APK_SRC" "$NAME"
          "$APKSIGNER" verify --verbose --print-certs "$NAME" | tee verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" verify.txt
          "$AAPT" dump badging "$NAME" | head -n1 | tee badging.txt
          grep -q "name='com.callcontrol.app'" badging.txt
          grep -q "versionName='${{ inputs.version }}'" badging.txt
          sha256sum "$NAME" > "$NAME.sha256"
          cat "$NAME.sha256"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ inputs.version }}"
          gh release create "$TAG" "$APK_NAME" "$APK_NAME.sha256" \
            --title "Call Control $TAG" \
            --notes "Signed release APK (versionCode ${{ github.run_number }}). Signing key: $KEY_KIND. SHA-256 is in the attached .sha256 file. Install on Android 10+, then enable the app as the call screening app from inside it."

      - name: Re-download and verify the published asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dl && cd dl
          gh release download "v${{ inputs.version }}" --repo "${{ github.repository }}"
          sha256sum -c "$APK_NAME.sha256"
