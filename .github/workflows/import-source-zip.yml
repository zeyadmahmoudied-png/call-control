name: Import Call Control source archive

on:
  push:
    branches: [main]
    paths:
      - 'CallControl-phase3-7-source.zip'
      - 'CallControl-phase3-7-source.zip.sha256'
      - '.github/workflows/import-source-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-call-control-source
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f CallControl-phase3-7-source.zip
          if test -f CallControl-phase3-7-source.zip.sha256; then
            sha256sum -c CallControl-phase3-7-source.zip.sha256
          fi
          rm -rf "$RUNNER_TEMP/callcontrol-source"
          mkdir -p "$RUNNER_TEMP/callcontrol-source"
          unzip -q CallControl-phase3-7-source.zip -d "$RUNNER_TEMP/callcontrol-source"
          test -d "$RUNNER_TEMP/callcontrol-source/CallControl"
          test -f "$RUNNER_TEMP/callcontrol-source/CallControl/settings.gradle.kts" -o -f "$RUNNER_TEMP/callcontrol-source/CallControl/settings.gradle"
          echo "SOURCE_DIR=$RUNNER_TEMP/callcontrol-source/CallControl" >> "$GITHUB_ENV"
          echo "Extracted source tree:"
          find "$RUNNER_TEMP/callcontrol-source/CallControl" -maxdepth 3 -type f | sort | head -200

      - name: Preserve archives and stage source without workflow files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive/phase2 archive/source-zips
          if test -f CallControl-phase2.zip; then cp -n CallControl-phase2.zip archive/phase2/; fi
          if test -f CallControl-phase2.zip.sha256; then cp -n CallControl-phase2.zip.sha256 archive/phase2/; fi
          if test -f CallControl-phase3-7-source.zip; then cp -n CallControl-phase3-7-source.zip archive/source-zips/; fi
          if test -f CallControl-phase3-7-source.zip.sha256; then cp -n CallControl-phase3-7-source.zip.sha256 archive/source-zips/; fi
          rsync -a --exclude='.github/workflows/***' "$SOURCE_DIR/" .
          cp "$SOURCE_DIR/.github/workflows/ci.yml" ci.yml.source
          cp "$SOURCE_DIR/.github/workflows/release.yml" release.yml.source
          test -f gradlew
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          echo "Source staged. Workflow definitions retained as *.yml.source pending workflow-permission install."
          git status --short

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Import Call Control phases 3-7 source"
          git push origin HEAD:main
